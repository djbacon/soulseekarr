<script nonce="{{ request.state.csp_nonce }}">
function updateSearchCooldownTimers() {
  const now = Date.now() / 1000;
  document.querySelectorAll('[data-cooldown-until]').forEach(cell => {
    const until = Number(cell.dataset.cooldownUntil);
    const remaining = Number.isFinite(until) ? Math.max(0, Math.ceil(until - now)) : 0;
    if (!remaining) {
      cell.textContent = '';
      return;
    }
    const days = Math.floor(remaining / 86400);
    const hours = Math.floor((remaining % 86400) / 3600);
    const minutes = Math.floor((remaining % 3600) / 60);
    const seconds = remaining % 60;
    const clock = [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
    cell.textContent = `${days ? `${days}d ` : ''}${clock}`;
  });
}
</script>
